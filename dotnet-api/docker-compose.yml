services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foreign
      POSTGRES_PASSWORD: foreign
      POSTGRES_DB: foreign_affairs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foreign -d foreign_affairs"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./src/ForeignAffairs.Api
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Postgres
      ConnectionStrings__Default: "Host=db;Port=5432;Database=foreign_affairs;Username=foreign;Password=foreign"
      Cors__AllowedOrigins__0: "http://localhost:5173"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
